<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7a0 LoL — Monte o time dos sonhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#010a13;--bg2:#091428;--card:#1e2328;--ink:#f0e6d2;--mut:#a09b8c;--line:#463714;--gold:#c8aa6e;--gold2:#785a28;--acc:#0ac8b9;--ok:#0ac8b9;--bad:#e84057;--head:"Cinzel","Beaufort for LOL","Trajan Pro",Georgia,serif;--body:"Inter","Spiegel",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);line-height:1.5;background:radial-gradient(1100px 500px at 50% -10%,#0a323c 0%,transparent 70%),linear-gradient(180deg,var(--bg2),var(--bg) 60%)}
main{max-width:780px;margin:0 auto;padding:28px 16px 56px}
h1,h2{font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
h1{font-size:2.4rem;margin:.2em 0;color:#dcc07a;text-shadow:0 0 18px rgba(200,170,110,.25)}
h1 b{font-weight:900}
h1 span{font-weight:500}
.sub{color:#e3dac5;margin:0 0 22px;font-size:1.05rem}
.btn{font-family:var(--head);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:.9rem;background:linear-gradient(180deg,#0397ab,#0a6e7c);color:#f0e6d2;border:1px solid var(--acc);border-radius:2px;padding:13px 26px;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){background:var(--acc);color:#010a13}
.btn.sec{background:transparent;color:var(--gold);border:1px solid var(--gold2)}
.btn.sec:hover:not(:disabled){border-color:var(--gold);background:rgba(200,170,110,.12);color:#f0e6d2}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}
.slot{background:rgba(30,35,40,.6);border:1px dashed var(--line);border-radius:2px;padding:10px 6px;text-align:center;min-height:90px}
.slot.f{border:1px solid var(--gold2);background:linear-gradient(180deg,#1e2328,#0a1428);box-shadow:inset 0 0 0 1px rgba(200,170,110,.12)}
.slot .r{font-family:var(--head);font-size:.68rem;color:var(--gold);text-transform:uppercase;letter-spacing:.12em}
.slot .n{font-weight:700;margin-top:4px;word-break:break-word}
.slot .t{font-size:.68rem;color:var(--mut)}
.slot .v{font-family:var(--head);color:var(--gold);font-weight:900;font-size:1.1rem}
.roll{background:linear-gradient(180deg,#1e2328,#0a1428);border:1px solid var(--gold2);padding:18px;margin-top:8px;box-shadow:0 0 0 3px #010a13,0 0 0 4px var(--line)}
.roll h2{margin:0;font-size:1.4rem;color:var(--gold)}
.roll .y{color:var(--mut);margin:2px 0 14px}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.pl button{background:#010a13;border:1px solid var(--line);border-radius:2px;padding:10px;color:var(--ink);cursor:pointer;text-align:left;font:inherit;transition:.15s}
.pl button:hover:not(:disabled){border-color:var(--acc);box-shadow:0 0 10px rgba(10,200,185,.25)}
.pl button:disabled{opacity:.3;cursor:not-allowed}
.pl .r{font-family:var(--head);font-size:.68rem;color:var(--acc);text-transform:uppercase;letter-spacing:.1em}
.pl .n{font-weight:700}
.pl .v{font-family:var(--head);color:var(--gold);font-weight:900;float:right}
.res{display:grid;gap:8px;margin:16px 0}
.m{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold2);padding:11px 14px}
.m.w{border-left-color:var(--ok)}.m.l{border-left-color:var(--bad)}
.m small{color:var(--mut);display:block;font-size:.76rem}
.sc{font-family:var(--head);font-weight:900;font-size:1.3rem;white-space:nowrap;color:var(--gold)}
.m.w .sc{color:var(--ok)}.m.l .sc{color:var(--bad)}
.big{font-family:var(--head);font-size:3.4rem;font-weight:900;margin:8px 0;color:#dcc07a;text-shadow:0 0 18px rgba(200,170,110,.25)}
.stat{color:#c9c2b0;font-size:.92rem}
.stat b{color:var(--gold)}
.dots{display:flex;gap:5px;margin-top:6px;min-height:10px}
.d{width:10px;height:10px;border-radius:50%;display:inline-block}
.d.w{background:var(--ok)}.d.l{background:var(--bad)}
.m.live{border-left-color:var(--gold);box-shadow:0 0 14px rgba(200,170,110,.25)}
.pend{color:var(--gold);font-size:.85rem;animation:bl 1s infinite alternate}
@keyframes bl{from{opacity:.4}to{opacity:1}}
.chip{padding:9px 14px;font-size:.78rem}
.chip.on{border-color:var(--gold);background:rgba(200,170,110,.18);color:#f0e6d2}
.m>div:first-child{flex:1;min-width:0}
.lg{font-size:.82rem;color:#c9c2b0;margin-top:6px;padding-left:9px;border-left:2px solid var(--line);line-height:1.4}
.lg.w{border-left-color:var(--ok)}.lg.l{border-left-color:var(--bad)}
.lg b{color:var(--ink)}.lg .gn{font-family:var(--head);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-right:4px}
.hide{display:none}
@media(max-width:520px){.lineup{grid-template-columns:repeat(2,1fr)}h1{font-size:1.8rem}}
</style>
</head>
<body>
<main>
<div id="app"></div>
</main>
<script>
const ROLES=['Top','Jungle','Mid','ADC','Suporte'];
const RAW=`SKT T1|2013|Impact:86,Bengi:90,Faker:92,Piglet:88,PoohManDu:82
Samsung White|2014|Looper:88,DanDy:84,PawN:88,imp:86,Mata:90
SKT T1|2015|MaRin:92,Bengi:92,Faker:96,Bang:90,Wolf:90
SKT T1|2016|Duke:90,Bengi:90,Faker:96,Bang:94,Wolf:92
SKT T1|2017|Huni:89,Peanut:93,Faker:95,Bang:93,Wolf:90
Samsung Galaxy|2017|CuVee:93,Ambition:92,Crown:92,Ruler:92,CoreJJ:90
Invictus Gaming|2018|TheShy:97,Ning:90,Rookie:93,JackeyLove:90,Baolan:84
Royal Never Give Up|2018|Letme:88,Mlxg:88,Xiaohu:90,Uzi:96,Ming:88
FunPlus Phoenix|2019|GimGoon:86,Tian:92,Doinb:94,Lwx:90,Crisp:92
G2 Esports|2019|Wunder:90,Jankos:92,Caps:94,Perkz:92,Mikyx:88
Fnatic|2015|Huni:88,Reignover:88,Febiven:86,Rekkles:86,YellOwStaR:88
Fnatic|2018|Bwipo:88,Broxah:86,Caps:92,Rekkles:92,Hylissang:86
DAMWON Gaming|2020|Nuguri:92,Canyon:96,ShowMaker:94,Ghost:90,BeryL:94
EDward Gaming|2021|Flandre:88,Jiejie:90,Scout:92,Viper:94,Meiko:90
DRX|2022|Kingen:88,Pyosik:90,Zeka:92,Deft:94,BeryL:92
LOUD|2022|Robo:80,Croc:82,tinowns:84,Brance:84,RedBert:80
JD Gaming|2023|369:92,Kanavi:94,Knight:95,Ruler:94,Missing:88
Gen.G|2023|Doran:86,Peanut:92,Chovy:96,Peyz:92,Delight:88
Gen.G|2024|Kiin:92,Canyon:95,Chovy:97,Peyz:93,Lehends:92
T1|2024|Zeus:94,Oner:95,Faker:96,Gumayusi:95,Keria:98
Bilibili Gaming|2024|Bin:95,Xun:90,Knight:94,Elk:92,ON:88
Hanwha Life Esports|2024|Zeus:93,Peanut:92,Zeka:92,Viper:95,Delight:90
Cloud9|2018|Licorice:84,Blaber:86,Jensen:88,Sneaky:86,Zeyzal:82
Team Liquid|2019|Impact:86,Xmithie:84,Jensen:88,Doublelift:90,CoreJJ:88
TSM|2018|Hauntzer:82,Svenskeren:82,Bjergsen:88,Zven:84,Mithy:80
100 Thieves|2021|Ssumday:84,Closer:84,Abbedagge:80,FBI:82,Huhi:78
MAD Lions|2021|Armut:84,Elyoya:86,Humanoid:86,Carzzy:84,Kaiser:84
G2 Esports|2021|BrokenBlade:86,Jankos:86,Caps:90,Rekkles:86,Mikyx:84
G2 Esports|2023|BrokenBlade:88,Yike:84,Caps:90,Hans sama:88,Mikyx:86
PSG Talon|2021|Hanabi:82,River:80,Maple:84,Unified:80,Kaiwing:82
paiN Gaming|2021|Robo:78,Cariok:78,Tinowns:80,brTT:80,Luci:76
LØS|2026|Zest:80,Curse:78,Feisty:80,Duduhh:78,Ackerman:76`;
const ORG={'SKT T1':'T1','Samsung Galaxy':'Gen.G','Samsung White':'Gen.G'};
const REG={'SKT T1':'LCK','Samsung White':'LCK','Samsung Galaxy':'LCK','DAMWON Gaming':'LCK','DRX':'LCK','Gen.G':'LCK','T1':'LCK','Hanwha Life Esports':'LCK','Invictus Gaming':'LPL','Royal Never Give Up':'LPL','FunPlus Phoenix':'LPL','EDward Gaming':'LPL','JD Gaming':'LPL','Bilibili Gaming':'LPL','G2 Esports':'LEC','Fnatic':'LEC','MAD Lions':'LEC','Cloud9':'LCS','Team Liquid':'LCS','TSM':'LCS','100 Thieves':'LCS','PSG Talon':'PCS','LOUD':'CBLOL','paiN Gaming':'CBLOL','LØS':'CBLOL'};
const TEAMS=RAW.split('\n').map(l=>{const[a,y,p]=l.split('|');return{name:a,year:y,pl:p.split(',').map((x,i)=>{const[n,v]=x.split(':');return{n,v:+v,role:i,team:a+' '+y,org:ORG[a]||a}})}});
const ROUNDS=[['Fase Suíça · R1',3],['Fase Suíça · R2',3],['Fase Suíça · R3',3],['Quartas de final',5],['Semifinal',5],['Final',5],['Grande final',5]];
const avgOf=t=>t.pl.reduce((a,p)=>a+p.v,0)/5;
function opponents(){const mine=S.lineup.map(p=>p.team);const pool=TEAMS.filter(t=>!mine.includes(t.name+' '+t.year)).sort((a,b)=>avgOf(a)-avgOf(b));const n=pool.length,w=Math.max(1,Math.round(n/10)),used=new Set(),res=[];for(let k=0;k<ROUNDS.length;k++){const c=Math.round(k*(n-1)/6);let lo=Math.max(0,c-w),hi=Math.min(n-1,c+w);if(k===ROUNDS.length-1){hi=n-1;lo=Math.max(0,n-1-2*w)}let cand=[];for(let i=lo;i<=hi;i++)if(!used.has(i))cand.push(i);if(!cand.length)for(let i=0;i<n;i++)if(!used.has(i))cand.push(i);const i=cand[Math.floor(Math.random()*cand.length)];used.add(i);res.push(pool[i])}return res.sort((a,b)=>avgOf(a)-avgOf(b))}
const $=s=>document.querySelector(s),app=$('#app');
let S;
function fresh(){S={lineup:[null,null,null,null,null],used:[],cur:null,rr:2,phase:'intro'}}
function best(){try{return localStorage.getItem('lol7a0best')||'0'}catch(e){return '0'}}
function saveBest(w){try{if(w>+best())localStorage.setItem('lol7a0best',w)}catch(e){}}
function roll(){const av=TEAMS.map((t,i)=>i).filter(i=>!S.used.includes(i));const i=av[Math.floor(Math.random()*av.length)];S.used.push(i);S.cur=TEAMS[i]}
function start(){fresh();S.phase='draft';roll();draw()}
function pick(i){const p=S.cur.pl[i];if(S.lineup[p.role])return;S.lineup[p.role]=p;if(S.lineup.every(Boolean)){S.phase='ready';S.cur=null}else roll();draw()}
function reroll(){if(S.rr<1)return;S.rr--;roll();draw()}
function strength(){const L=S.lineup,avg=L.reduce((a,p)=>a+p.v,0)/5;const c={};L.forEach(p=>c[p.org]=(c[p.org]||0)+1);let syn=0;const grp=[];for(const k in c)if(c[k]>1){syn+=(c[k]-1)*1.2;grp.push(k+' ('+c[k]+')')}return{avg,syn,grp,tot:avg+syn}}
function lineupHTML(){return '<div class="lineup">'+ROLES.map((r,i)=>{const p=S.lineup[i];return p?`<div class="slot f"><div class="r">${r}</div><div class="n">${p.n}</div><div class="t">${p.team}</div><div class="v">${p.v}</div></div>`:`<div class="slot"><div class="r">${r}</div><div class="n" style="color:var(--mut)">—</div></div>`}).join('')+'</div>'}
function draw(){
 if(S.phase==='intro'){app.innerHTML=`<h1>7<b>a</b>0 <span style="font-weight:400">LoL</span></h1><p class="sub">Role os dados, receba um time e uma temporada do cenário competitivo, escolha um jogador que realmente esteve lá e monte seu line-up dos sonhos. Depois enfrente 7 séries: vença todas e você alcança o 7–0.</p><div class="row"><button class="btn" id="go">Jogar →</button></div><p class="stat">Melhor campanha: ${best()} vitórias seguidas · ${TEAMS.length} elencos · ${TEAMS.length*5} jogadores</p><p class="stat">Dica: jogadores da mesma organização ganham bônus de entrosamento, mesmo que de anos diferentes (ex.: Faker em 2013 e Keria em 2024, ambos T1).</p>`;$('#go').onclick=start;return}
 if(S.phase==='draft'){const n=S.lineup.filter(Boolean).length;app.innerHTML=`<h1>Escolha ${n+1}/5</h1>${lineupHTML()}<div class="roll"><h2>${S.cur.name}</h2><p class="y">Temporada ${S.cur.year} · ${REG[S.cur.name]||''} · escolha uma lane ainda vaga</p><div class="pl">${S.cur.pl.map((p,i)=>`<button data-i="${i}" ${S.lineup[p.role]?'disabled':''}><span class="v">${p.v}</span><div class="r">${ROLES[p.role]}</div><div class="n">${p.n}</div></button>`).join('')}</div></div><div class="row" style="margin-top:12px"><button class="btn sec" id="rr" ${S.rr<1?'disabled':''}>Rolar de novo (${S.rr})</button></div>`;
  app.querySelectorAll('.pl button').forEach(b=>b.onclick=()=>pick(+b.dataset.i));$('#rr').onclick=reroll;return}
 if(S.phase==='ready'){const s=strength();app.innerHTML=`<h1>Seu time está pronto</h1>${lineupHTML()}<p class="stat">Média ${s.avg.toFixed(1)} + entrosamento ${s.syn.toFixed(1)} = força <b>${s.tot.toFixed(1)}</b></p><p class="stat">${s.grp.length?'Entrosamento: '+s.grp.join(', '):'Sem entrosamento: nenhum jogador da mesma organização.'}</p><p class="stat" style="margin-top:18px">Modo:</p><div class="row">${chips('mode',MODES)}</div><p class="stat" id="mdesc">${MDESC[CFG.mode]}</p><p class="stat" style="margin-top:12px">Velocidade:</p><div class="row">${chips('speed',SPEEDS)}</div><p class="stat" id="sdesc">${SDESC[CFG.speed]}</p><div class="row" style="margin-top:14px"><button class="btn" id="sim">Simular campanha</button><button class="btn sec" id="re">Recomeçar</button></div>`;app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const g=b.dataset.g;CFG[g]=b.dataset.k;app.querySelectorAll('.chip[data-g="'+g+'"]').forEach(c=>c.classList.toggle('on',c===b));$('#mdesc').textContent=MDESC[CFG.mode];$('#sdesc').textContent=SDESC[CFG.speed]});$('#sim').onclick=sim;$('#re').onclick=start;return}
}
let SKIP=false;
const CFG={mode:'auto',speed:'normal'};
const MODES={auto:'Automático',manual:'Manual'};
const SPEEDS={slow:'Devagar',normal:'Normal',fast:'Rápido'};
const MDESC={auto:'As partidas acontecem sozinhas, uma após a outra, até a campanha terminar ou você ser eliminado.',manual:'Você clica para iniciar cada série; os jogos de cada série acontecem sozinhos. A campanha termina quando acabar ou você for eliminado.'};
const SDESC={slow:'Devagar: cada jogo leva até 4 segundos, com mais suspense nos jogos de match point e decisivos.',normal:'Normal: cada partida leva cerca de 2 segundos.',fast:'Rápido: cada partida leva menos de 1 segundo.'};
const T={slow:{g:3000,p:3500,d:4000,gap:800,end:1000},normal:{g:1800,p:2100,d:2500,gap:500,end:700},fast:{g:600,p:800,d:1000,gap:200,end:300}};
const chips=(g,o)=>Object.keys(o).map(k=>`<button class="btn sec chip${k===CFG[g]?' on':''}" data-g="${g}" data-k="${k}">${o[k]}</button>`).join('');
const sleep=ms=>SKIP?Promise.resolve():new Promise(r=>setTimeout(r,ms));
function series(me,opp,bo){const p=1/(1+Math.pow(10,(opp-me)/10)),need=(bo+1)/2;let a=0,b=0;const g=[];while(a<need&&b<need){const w=Math.random()<p;w?a++:b++;g.push(w)}return{a,b,g,w:a>b}}
const STORY=[
['{p} venceu o duelo na rota de cima, derrubou a primeira torre e abriu vantagem para o time','{p} acertou o teleporte no momento certo e virou a luta pelo Barão','{p} aguentou sozinho a pressão de dois jogadores no top e segurou a torre até o fim','{p} flanqueou pelo lado e pegou a retaguarda inimiga no meio da luta','{p} dividiu o mapa, empurrou a lane lateral e obrigou o rival a se desdobrar','{p} dominou a linha de frente e aguentou todo o dano da luta decisiva'],
['{p} fez o gank certeiro no começo, garantiu o primeiro abate e acelerou o jogo','{p} roubou o Barão com um smite perfeito e mudou o rumo da partida','{p} garantiu o Dragão com um smite no último segundo e fechou a Alma','{p} invadiu a selva inimiga, atrasou o rival e controlou os objetivos','{p} apareceu pelas costas na luta e pegou os dois carregadores adversários','{p} controlou o ritmo do mapa e não deu espaço para o rival respirar'],
['{p} venceu a rota do meio, ganhou prioridade e fez o time rotacionar primeiro','{p} acertou a habilidade em área que pegou três inimigos na luta decisiva','{p} eliminou o ADC rival logo no começo da luta e definiu a partida','{p} controlou a luta com o controle de multidão e protegeu a equipe','{p} flanqueou do meio e fechou o Ace que terminou a partida','{p} fez a rota ficar sem respiro e abriu o mapa para os companheiros'],
['{p} causou dano enorme em todas as lutas e carregou o time na reta final','{p} sobreviveu à luta com pouca vida e fechou o Ace','{p} fez um kite perfeito e derrubou o time inimigo quase sozinho','{p} escalou bem com os itens completos e dominou a fase final','{p} se posicionou com precisão e derrubou o nexus no momento certo','{p} foi o grande destaque da luta do Dragão, com dano constante sem sair do lugar'],
['{p} acertou a iniciação decisiva e virou a luta a favor do time','{p} salvou o ADC no último segundo com um escudo e permitiu a virada','{p} dominou a visão do mapa e evitou todas as emboscadas do rival','{p} protegeu o carregador com perfeição e a luta foi decidida a favor','{p} pegou o inimigo fora de posição e abriu a vantagem em abates','{p} rodou pelo mapa no tempo certo e garantiu o controle dos objetivos']];
function moment(m,j,win,ur,decisive){
 const team=win?S.lineup:m.o.pl;let roles=[0,1,2,3,4].filter(r=>!ur.has(r));if(!roles.length)roles=[0,1,2,3,4];
 const r=roles[Math.floor(Math.random()*roles.length)];ur.add(r);
 const p=team[r],arr=STORY[r],txt=arr[Math.floor(Math.random()*arr.length)].replace('{p}','<b>'+p.n+'</b>');
 return `<div class="lg ${win?'w':'l'}"><span class="gn">Jogo ${j+1}${decisive?' (decisivo)':''}</span> ${win?'':'['+m.o.name+' '+m.o.year+'] '}${txt}</div>`}
async function sim(){
 const s=strength(),opp=opponents(),t=T[CFG.speed],manual=CFG.mode==='manual';let wins=0,over=false;const out=[];SKIP=false;
 for(let k=0;k<ROUNDS.length;k++){if(over)break;const[r,bo]=ROUNDS[k],o=opp[k],x=series(s.tot,avgOf(o),bo);out.push({r,o,bo,...x});if(x.w)wins++;else over=true}
 saveBest(wins);
 const desc=o=>`${o.name} ${o.year}<small>${o.pl.map(p=>p.n).join(' · ')} · força ${avgOf(o).toFixed(1)}</small>`;
 app.innerHTML=`<h1>Campanha</h1>${lineupHTML()}<p class="stat">Seus adversários, em ordem de dificuldade:</p><div class="res" id="res">${opp.map((o,k)=>`<div class="m" id="m${k}"><div><small style="display:inline">${ROUNDS[k][0]} (MD${ROUNDS[k][1]})</small><br><b>vs ${desc(o)}</b><div class="dots" id="d${k}"></div><div class="log" id="l${k}"></div></div><div class="sc" id="s${k}">vs</div></div>`).join('')}</div><div class="row"><button class="btn hide" id="nx">Jogar →</button><button class="btn sec" id="skip">Pular animação</button></div><div id="end" class="hide"></div>`;
 $('#skip').onclick=()=>{SKIP=true;const n=$('#nx');if(!n.classList.contains('hide'))n.click()};
 const next=lbl=>new Promise(res=>{if(SKIP)return res();const b=$('#nx');b.textContent=lbl;b.classList.remove('hide');b.onclick=()=>{b.classList.add('hide');res()}});
 for(let i=0;i<out.length;i++){
  const m=out[i],el=$('#m'+i),sc=$('#s'+i),dots=$('#d'+i),need=(m.bo+1)/2;
  el.classList.add('live');if(!SKIP)el.scrollIntoView({block:'center',behavior:'smooth'});
  let a=0,b=0;const ur=new Set();
  if(manual)await next(`Iniciar série: ${m.r} →`);
  for(let j=0;j<m.g.length;j++){
   const decisive=a===need-1&&b===need-1,point=a===need-1||b===need-1;
   const lbl=decisive?'Jogo decisivo':'Jogo '+(j+1);
   sc.innerHTML=`<span class="pend">${lbl}…</span>`;
   await sleep(decisive?t.d:point?t.p:t.g);
   m.g[j]?a++:b++;sc.textContent=a+'–'+b;dots.insertAdjacentHTML('beforeend',`<i class="d ${m.g[j]?'w':'l'}"></i>`);$('#l'+i).insertAdjacentHTML('beforeend',moment(m,j,m.g[j],ur,decisive));
   if(j<m.g.length-1)await sleep(t.gap);
  }
  el.classList.remove('live');el.classList.add(m.w?'w':'l');sc.textContent=a+'–'+b;
  await sleep(t.end);
 }
 $('#skip').classList.add('hide');$('#nx').classList.add('hide');
 final(wins,out.length);
}
function final(w,played){
 const perfect=w===7,e=$('#end');e.classList.remove('hide');
 const txt=`Meu time no 7a0 LoL: ${S.lineup.map(p=>p.n).join(' / ')} — campanha ${w}–${7-w>0&&played<7?played-w:7-w}${perfect?' 🏆 7–0!':''}`;
 const lost=played-w;
 e.innerHTML=`<div class="big">${w}–${lost}</div><p>${perfect?'Campanha perfeita! Você chegou ao 7–0.':w>=5?'Chegou perto da perfeição.':w>=3?'Campanha respeitável, mas dá para melhorar.':'Eliminado cedo. Tente outro draft.'}</p><div class="row"><button class="btn" id="again">Jogar de novo</button><button class="btn sec" id="cp">Copiar resultado</button></div>`;
 $('#again').onclick=start;
 $('#cp').onclick=()=>{const m=`Meu time no 7a0 LoL: ${S.lineup.map(p=>p.n).join(' / ')} · ${w}–${lost}${perfect?' 🏆':''}`;try{navigator.clipboard.writeText(m);$('#cp').textContent='Copiado!'}catch(x){$('#cp').textContent=m}}
}
fresh();draw();
</script>
